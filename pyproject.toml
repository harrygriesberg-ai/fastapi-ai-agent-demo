[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "fastapi-ai-agent-demo"
version = "1.0.0"
description = "Bounded tool-using agent loop with Pydantic validation and inspectable traces"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.9", "pydantic-settings>=2.5"]
[project.optional-dependencies]
openai = ["openai>=1.50"]
dev = ["httpx>=0.27", "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6"]
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
